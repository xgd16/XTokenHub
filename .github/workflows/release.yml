name: Release

# 推送 v* 标签时自动构建全平台二进制并发布 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: make web

      - name: Cross compile all platforms
        run: make dist VERSION=${GITHUB_REF_NAME#v}

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 xtokenhub-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: XTokenHub ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/xtokenhub-*.tar.gz
            dist/xtokenhub-*.zip
            dist/checksums.txt

  # macOS 菜单栏伴侣应用：云端构建 dmg（macos-26 runner 自带 Xcode 26）
  dmg:
    runs-on: macos-26
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build DMG
        run: |
          cd XTokenHubMenuBar
          make package DMG_NAME=XTokenHubMenuBar-${GITHUB_REF_NAME}-macos.dmg

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          name: XTokenHub ${{ github.ref_name }}
          generate_release_notes: true
          files: XTokenHubMenuBar/XTokenHubMenuBar-*-macos.dmg
