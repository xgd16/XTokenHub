name: XTokenHubMenuBar
options:
  bundleIdPrefix: com.xtokenhub
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    # 本地开发用 ad-hoc 签名(无开发者账号也能跑,App Sandbox entitlement 合法)
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  XTokenHubMenuBar:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xtokenhub.menubar
        PRODUCT_NAME: XTokenHubMenuBar
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/XTokenHubMenuBar.entitlements
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  XTokenHubMenuBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: XTokenHubMenuBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xtokenhub.menubar.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XTokenHubMenuBar.app/Contents/MacOS/XTokenHubMenuBar"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
schemes:
  XTokenHubMenuBar:
    build:
      targets:
        XTokenHubMenuBar: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - XTokenHubMenuBarTests
